services:
  app:
    build: .
    image: leaderboard-service:local
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/leaderboard
      DB_USERNAME: leaderboard
      DB_PASSWORD: leaderboard
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: leaderboard
      POSTGRES_USER: leaderboard
      POSTGRES_PASSWORD: leaderboard
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18+ images keep their data under a versioned subdirectory of /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaderboard -d leaderboard"]
      interval: 5s
      timeout: 3s
      retries: 10

  # No volume on purpose: Redis is a rebuildable cache of the leaderboard. If its container is
  # recreated, the app rebuilds the sorted set from PostgreSQL on its next start.
  redis:
    image: redis:8.10.3-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Load test. Not started by `docker compose up`; run it with `docker compose run --rm k6`.
  k6:
    image: grafana/k6:2.3.0
    profiles: ["load"]
    command: ["run", "/load/leaderboard.js"]
    environment:
      BASE_URL: http://app:8080
    volumes:
      - ./load:/load
    depends_on:
      - app

volumes:
  postgres-data:
